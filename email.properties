# ==============================================================================
# CẤU HÌNH GỬI EMAIL THÔNG BÁO & NHẮC NHỞ PHÒNG HỌP (SMTP GMAIL / CÔNG TY)
# ==============================================================================
# Lưu ý:
# 1. Để gửi email thực tế qua Gmail, bạn cần tạo "Mật khẩu ứng dụng" (App Password) tại:
#    https://myaccount.google.com/apppasswords
# 2. Nếu để trống username hoặc password, hệ thống sẽ tự động chạy chế độ MÔ PHỎNG (Mock Mode):
#    vẫn xử lý thành công và in log chi tiết ra màn hình Server Console để demo đồ án mượt mà.
# ==============================================================================

mail.enabled=true
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true

# Địa chỉ Gmail người gửi (Ví dụ: your_company_email@gmail.com)
mail.smtp.username=

# Mật khẩu ứng dụng 16 ký tự của Gmail (Không phải mật khẩu đăng nhập tài khoản thường)
mail.smtp.password=

# Tên hiển thị người gửi
mail.from.name=Hệ Thống Đặt Phòng Họp Công Ty
